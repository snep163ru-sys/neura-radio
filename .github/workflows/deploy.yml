name: Deploy neura-radio

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /home/snep/neura-radio
            git pull origin master
            docker build -t neura-radio:latest .
            docker rm -f neura-radio 2>/dev/null || true
            docker run -d --name neura-radio -p 8082:80 neura-radio:latest
            echo "Deploy OK"